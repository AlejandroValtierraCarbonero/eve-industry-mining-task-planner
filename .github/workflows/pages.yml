name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          path: testing
      - name: Prepare static site
        run: |
          mkdir -p dist/testing
          cp production/index.html production/styles.css production/app.js production/planner.js dist/
          cp testing/index.html testing/styles.css testing/app.js testing/planner.js dist/testing/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
