name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - testing
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out testing branch
        uses: actions/checkout@v4
        with:
          ref: testing
          path: testing
      - name: Read latest SDE build number
        id: sde-version
        run: |
          mkdir -p .cache/sde
          curl --fail --silent --show-error https://developers.eveonline.com/static-data/tranquility/latest.jsonl -o .cache/sde/latest.jsonl
          BUILD_NUMBER=$(python -c 'import json; rows=(json.loads(line) for line in open(".cache/sde/latest.jsonl", encoding="utf-8")); print(next(row["buildNumber"] for row in rows if row.get("_key") == "sde"))')
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Restore official SDE archive cache
        uses: actions/cache@v4
        with:
          path: .cache/sde/sde.zip
          key: eve-sde-jsonl-${{ steps.sde-version.outputs.build }}
      - name: Download official SDE archive
        run: |
          if [ ! -s .cache/sde/sde.zip ]; then
            curl --fail --location --silent --show-error \
              "https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-${{ steps.sde-version.outputs.build }}-jsonl.zip" \
              -o .cache/sde/sde.zip
          fi
      - name: Run application and catalog tests
        run: |
          cd production
          node --test planner.test.js
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare static site
        run: |
          mkdir -p dist/testing
          cp production/index.html production/styles.css production/app.js production/planner.js dist/
          cp testing/index.html testing/styles.css testing/app.js testing/planner.js dist/testing/
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA}\"|; s|src=\"planner.js\"|src=\"planner.js?v=${GITHUB_SHA}\"|; s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA}\"|" dist/index.html dist/testing/index.html
          python production/scripts/build_sde_catalog.py \
            --archive .cache/sde/sde.zip \
            --output dist/testing/sde-blueprints.json \
            --build-number "${{ steps.sde-version.outputs.build }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
